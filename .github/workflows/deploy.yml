name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check server.js && find routes models middleware config -name '*.js' | xargs -I{} node --check {}

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /var/www/md-blog
            git fetch origin
            git reset --hard origin/main
            npm install
            npm run build 2>/dev/null || true
            pm2 restart md-blog --update-env 2>/dev/null || pm2 start server.js --name "md-blog"
            pm2 save
            echo "✅ Deployment complete"
